<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App 導覽列與頁內頁示範</title>
    <style>
        /* 基礎設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 模擬手機 APP 容器 */
        .app-container {
            width: 100%;
            max-width: 414px; /* 模擬 iPhone Pro Max 寬度 */
            height: 100vh;
            max-height: 896px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* 頂部標題列 */
        .header {
            padding: 20px 15px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            color: #333;
        }

        /* 主要內容區 (可滾動) */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 70px; /* 預留底部導覽列空間 */
        }

        /* 頁面切換控制 */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* 頁面內的文字樣式 */
        .page-text {
            font-size: 16px;
            color: #333;
            word-wrap: break-word;
        }

        /* ======= 第二頁：頁內頁專屬樣式 ======= */
        .sub-nav {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .sub-nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: #666;
            cursor: pointer;
            position: relative;
            font-size: 16px;
        }

        .sub-nav-item.active {
            color: #1890ff; /* 激活時的藍色 */
            font-weight: bold;
        }

        .sub-nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            width: 60%;
            height: 3px;
            background-color: #1890ff;
            border-radius: 2px;
        }

        .sub-page {
            display: none;
        }
        
        .sub-page.active {
            display: block;
        }

        /* ======= 底部導覽列 ======= */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #999;
            cursor: pointer;
            flex: 1;
            padding: 10px 0;
        }

        .nav-item.active {
            color: #1890ff;
        }

        /* 簡單的 SVG icon 樣式 */
        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div class="header" id="app-header">Tab 1 這是第一頁標題</div>

    <div class="main-content">
<div id="page1" class="page active">
    <div class="intro-section">
        <h3>推薦神婆</h3>
        <p>點擊頭像了解更多資訊</p>
    </div>

    <div class="character-list">
        <div class="character-card fade-in" onclick="showModal('wang')">
            <div class="avatar">王</div>
            <div class="info">
                <div class="name">王婆婆</div>
                <div class="desc">擅長：米卦、尋物、問事</div>
            </div>
            <div class="arrow">❯</div>
        </div>

        <div class="character-card fade-in" onclick="showModal('li')">
            <div class="avatar" style="background-color: #ff85c0;">李</div>
            <div class="info">
                <div class="name">李阿姨</div>
                <div class="desc">擅長：塔羅、情感諮詢、淨化</div>
            </div>
            <div class="arrow">❯</div>
        </div>
    </div>

    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body">
                </div>
        </div>
    </div>
</div>

        <div id="page2" class="page">
            <div class="sub-nav">
                <div class="sub-nav-item active" onclick="switchSubPage(1)">1</div>
                <div class="sub-nav-item" onclick="switchSubPage(2)">2</div>
                <div class="sub-nav-item" onclick="switchSubPage(3)">3</div>
            </div>

            <div id="sub-page-1" class="sub-page active">
                <div class="page-text">22222222222222222222</div>
            </div>
            <div id="sub-page-2" class="sub-page">
                <div class="page-text">這裡是 Tab 2 裡面的第 2 個子頁面內容。</div>
            </div>
            <div id="sub-page-3" class="sub-page">
                <div class="page-text">這裡是 Tab 2 裡面的第 3 個子頁面內容。</div>
            </div>
        </div>

        <div id="page3" class="page">
            <div class="page-text">3333333333333333</div>
        </div>

        <div id="page4" class="page">
            <div class="page-text">4444444444444</div>
        </div>

        <div id="page5" class="page">
            <div class="page-text">55555555555555555</div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage(1, 'Tab 1 這是第一頁標題')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        </div>
        <div class="nav-item" onclick="switchPage(2, 'Tab 2 這是第二頁標題')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 5v14h18V7h-7l-2-2H3zm2 2h4l2 2h8v10H5V7z"/></svg>
        </div>
        <div class="nav-item" onclick="switchPage(3, 'Tab 3 這是第三頁標題')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        </div>
        <div class="nav-item" onclick="switchPage(4, 'Tab 4 這是第四頁標題')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
        </div>
        <div class="nav-item" onclick="switchPage(5, 'Tab 5 這是第五頁標題')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
    </div>

</div>

<script>
    // 切換主頁面
    function switchPage(pageIndex, titleText) {
        // 更新標題
        document.getElementById('app-header').innerText = titleText;

        // 隱藏所有頁面，顯示目標頁面
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById('page' + pageIndex).classList.add('active');

        // 更新底部導覽列的狀態 (反藍)
        document.querySelectorAll('.nav-item').forEach((item, index) => {
            if (index + 1 === pageIndex) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    }

    // 切換 第二頁的「頁內頁」
    function switchSubPage(subIndex) {
        // 隱藏所有子頁面，顯示目標子頁面
        document.querySelectorAll('.sub-page').forEach(page => page.classList.remove('active'));
        document.getElementById('sub-page-' + subIndex).classList.add('active');

        // 更新頁內頁導覽列的狀態 (反藍底線)
        document.querySelectorAll('.sub-nav-item').forEach((item, index) => {
            if (index + 1 === subIndex) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    }
</script>

</body>
</html>
