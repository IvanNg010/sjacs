<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神婆訪談錄 - 全螢幕版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-enter {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card-enter.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* 自定義捲軸樣式 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

    <header class="sticky top-0 z-40 w-full bg-white/90 backdrop-blur-md border-b border-gray-100 px-6 py-5 shadow-sm">
        <div class="max-w-5xl mx-auto">
            <h1 id="app-header" class="text-2xl font-black text-gray-900">認識神婆</h1>
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto p-6 pb-32">
        
        <section id="page1" class="page block">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div id="card-wang" onclick="showModal('wang')" 
                     class="card-enter flex items-center bg-white p-6 rounded-[32px] shadow-sm border border-gray-100 cursor-pointer hover:shadow-xl hover:-translate-y-1 active:scale-95 transition-all duration-300">
                    <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-md flex-shrink-0">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Granny&backgroundColor=ffdfbf" alt="王婆婆" class="w-full h-full object-cover">
                    </div>
                    <div class="ml-6 flex-1">
                        <h2 class="text-xl font-bold text-gray-800">王婆婆</h2>
                        <p class="text-xs font-bold text-amber-600 mb-2 uppercase tracking-widest">傳統神婆</p>
                        <p class="text-gray-500 text-sm leading-relaxed">在橋下從業三十年的老神婆，見證了無數人的悲歡離合。</p>
                    </div>
                    <div class="text-gray-300 ml-2">❯</div>
                </div>

                <div id="card-li" onclick="showModal('li')" 
                     class="card-enter flex items-center bg-white p-6 rounded-[32px] shadow-sm border border-gray-100 cursor-pointer hover:shadow-xl hover:-translate-y-1 active:scale-95 transition-all duration-300">
                    <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-md flex-shrink-0">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Auntie&backgroundColor=d1d5db" alt="李阿姨" class="w-full h-full object-cover">
                    </div>
                    <div class="ml-6 flex-1">
                        <h2 class="text-xl font-bold text-gray-800">李阿姨</h2>
                        <p class="text-xs font-bold text-blue-500 mb-2 uppercase tracking-widest">新派神婆</p>
                        <p class="text-gray-500 text-sm leading-relaxed">結合現代心理學與傳統占卜的新一代神婆。</p>
                    </div>
                    <div class="text-gray-300 ml-2">❯</div>
                </div>

            </div>
        </section>

        <section id="page2" class="page hidden bg-white rounded-3xl p-10 shadow-sm border border-gray-100">
            <p class="text-gray-400 text-center text-2xl font-mono">22222222222222222222</p>
        </section>
        </main>

    <nav class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-lg border-t border-gray-100 z-50">
        <div class="max-w-5xl mx-auto h-20 flex justify-around items-center px-4">
            <button onclick="switchPage(1, '認識神婆')" class="nav-btn flex flex-col items-center flex-1 text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                <span class="text-[10px] font-bold">認識神婆</span>
            </button>
            <button onclick="switchPage(2, '內容開發')" class="nav-btn flex flex-col items-center flex-1 text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h16v16H4V4z"/></svg>
                <span class="text-[10px] font-bold">頁面二</span>
            </button>
        </div>
    </nav>

    <div id="modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
        <div id="modal-content" class="bg-white w-full max-w-2xl rounded-[40px] max-h-[85vh] overflow-hidden flex flex-col transition-all duration-300 transform translate-y-10 opacity-0 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-6 right-8 text-gray-300 hover:text-gray-600 text-3xl z-10">&times;</button>
            
            <div id="modal-body" class="p-8 md:p-12 overflow-y-auto no-scrollbar">
                </div>
        </div>
    </div>

    <script>
        const characterData = {
            wang: {
                name: "王婆婆",
                tag: "傳統神婆",
                tagClass: "text-amber-600",
                qa: [
                    { q: "為甚麼選擇成為神婆？", a: "年輕時家裏窮，跟着長輩學的。後來發現，很多人來找我，其實只是想找個人説説心裏話。" },
                    { q: "您覺得打小人真的有用嗎？", a: "有用、沒用，信的人就有用。但更重要的是，打完之後，心裏的氣消了，能重新面對生活。" },
                    { q: "您怎麼看現在的年輕人？", a: "現在的年輕人壓力大，有時候需要一些傳統的方式來發洩。但我也告訴他們，打小人只是個開始，真正的問題還是要自己解決。" }
                ]
            },
            li: {
                name: "李阿姨",
                tag: "新派神婆",
                tagClass: "text-blue-500",
                qa: [
                    { q: "您是如何將傳統與現代結合的？", a: "我學過心理學，發現很多傳統儀式其實有心理療癒的作用。打小人就像情緒宣洩，祈禱就像正念瞑想。" },
                    { q: "您認為傳統文化還需要保留嗎？", a: "當然需要。傳統文化是我們的根，但我們要用現代的方式去理解和運用它，讓它真正幫助到現代人。" },
                    { q: "您對來諮詢的年輕人有甚麼建議？", a: "不要把所有希望都寄託在儀式中。儀式可以給你力量，但真正的改變來自於你的行動和思考。" }
                ]
            }
        };

        function triggerCardAnimation() {
            const cards = document.querySelectorAll('.card-enter');
            cards.forEach((card, i) => {
                card.classList.remove('show');
                setTimeout(() => card.classList.add('show'), i * 150);
            });
        }

        document.addEventListener("DOMContentLoaded", triggerCardAnimation);

        function showModal(key) {
            const data = characterData[key];
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            
            let qaHtml = `
                <div class="mb-8">
                    <p class="text-xs font-black ${data.tagClass} uppercase tracking-[0.2em] mb-1">${data.tag}</p>
                    <h2 class="text-3xl font-black text-gray-900">${data.name} 訪談錄</h2>
                </div>
                <div class="space-y-6">
            `;

            data.qa.forEach(item => {
                qaHtml += `
                    <div class="bg-gray-50 p-6 rounded-[24px] border border-gray-100">
                        <p class="text-blue-600 font-bold mb-2">Q：${item.q}</p>
                        <p class="text-gray-600 leading-relaxed font-medium">A：${item.a}</p>
                    </div>
                `;
            });

            qaHtml += `</div>`;
            document.getElementById('modal-body').innerHTML = qaHtml;
            
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-y-10', 'opacity-0'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            content.classList.add('translate-y-10', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function switchPage(idx, title) {
            document.getElementById('app-header').innerText = title;
            document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('hidden', i + 1 !== idx));
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.toggle('text-blue-600', i + 1 === idx);
                btn.classList.toggle('text-gray-400', i + 1 !== idx);
            });
            if(idx === 1) triggerCardAnimation();
        }
    </script>
</body>
</html>
