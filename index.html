<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神婆平台 - 全螢幕版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 進場動畫 */
        .card-enter {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card-enter.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 w-full bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 id="app-header" class="text-2xl font-black text-gray-900 tracking-tight">認識神婆</h1>
            <div class="text-sm text-gray-400 font-medium">聖若瑟英文中學</div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto p-6 pb-32">
        
        <section id="page1" class="page block">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div id="card-wang" onclick="showModal('wang')" 
                     class="card-enter flex items-center bg-white p-6 rounded-[32px] shadow-sm border border-gray-100 cursor-pointer hover:shadow-md hover:-translate-y-1 active:scale-95 transition-all duration-300">
                    <div class="w-20 h-20 rounded-full overflow-hidden border-4 border-gray-50 shadow-inner flex-shrink-0">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Granny" alt="王婆婆" class="w-full h-full object-cover">
                    </div>
                    <div class="ml-6 flex-1">
                        <h2 class="text-xl font-bold text-gray-800">王婆婆</h2>
                        <p class="text-gray-500 mt-1">資深米卦大師 · 30年經驗</p>
                        <div class="flex gap-2 mt-2">
                            <span class="text-[10px] bg-amber-50 text-amber-600 px-2 py-0.5 rounded uppercase font-bold tracking-wider">推薦</span>
                        </div>
                    </div>
                    <div class="text-gray-300 text-xl font-light">❯</div>
                </div>

                <div id="card-li" onclick="showModal('li')" 
                     class="card-enter flex items-center bg-white p-6 rounded-[32px] shadow-sm border border-gray-100 cursor-pointer hover:shadow-md hover:-translate-y-1 active:scale-95 transition-all duration-300">
                    <div class="w-20 h-20 rounded-full overflow-hidden border-4 border-gray-50 shadow-inner flex-shrink-0">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Auntie" alt="李阿姨" class="w-full h-full object-cover">
                    </div>
                    <div class="ml-6 flex-1">
                        <h2 class="text-xl font-bold text-gray-800">李阿姨</h2>
                        <p class="text-gray-500 mt-1">心靈諮詢 · 專業塔羅</p>
                        <div class="flex gap-2 mt-2">
                            <span class="text-[10px] bg-purple-50 text-purple-600 px-2 py-0.5 rounded uppercase font-bold tracking-wider">熱門</span>
                        </div>
                    </div>
                    <div class="text-gray-300 text-xl font-light">❯</div>
                </div>
            </div>
        </section>

        <section id="page2" class="page hidden">
            <div class="bg-white rounded-[32px] shadow-sm border border-gray-100 overflow-hidden">
                <div class="flex border-b border-gray-100 bg-gray-50/50">
                    <button onclick="switchSubPage(1)" class="sub-nav-btn flex-1 py-4 font-bold text-gray-400 border-b-2 border-transparent transition-all">分頁 01</button>
                    <button onclick="switchSubPage(2)" class="sub-nav-btn flex-1 py-4 font-bold text-gray-400 border-b-2 border-transparent transition-all">分頁 02</button>
                    <button onclick="switchSubPage(3)" class="sub-nav-btn flex-1 py-4 font-bold text-gray-400 border-b-2 border-transparent transition-all">分頁 03</button>
                </div>
                <div class="p-10 min-h-[300px]">
                    <div id="sub-page-1" class="sub-page block animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                        <div class="h-4 bg-gray-100 rounded w-1/2"></div>
                        <p class="mt-8 text-4xl font-mono text-gray-300">22222222222222222222</p>
                    </div>
                    <div id="sub-page-2" class="sub-page hidden text-gray-600">這裡可以放置更詳細的數據圖表或開發文件。</div>
                    <div id="sub-page-3" class="sub-page hidden text-gray-600">這是第三個子分頁的內容區塊。</div>
                </div>
            </div>
        </section>

        <section id="page3" class="page hidden p-10 text-center text-gray-300 text-6xl font-mono">3333333333</section>
        <section id="page4" class="page hidden p-10 text-center text-gray-300 text-6xl font-mono">4444444444</section>
        <section id="page5" class="page hidden p-10 text-center text-gray-300 text-6xl font-mono">5555555555</section>
    </main>

    <nav class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md border-t border-gray-200 pb-safe z-50">
        <div class="max-w-5xl mx-auto h-20 flex justify-around items-center px-4">
            <button onclick="switchPage(1, '認識神婆')" class="nav-btn flex flex-col items-center flex-1 transition-colors duration-300 text-blue-600">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="text-[10px] mt-1 font-bold">神婆</span>
            </button>
            <button onclick="switchPage(2, '詳細資訊')" class="nav-btn flex flex-col items-center flex-1 transition-colors duration-300 text-gray-400">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="text-[10px] mt-1 font-bold">詳情</span>
            </button>
            <button onclick="switchPage(3, '記事本')" class="nav-btn flex flex-col items-center flex-1 transition-colors duration-300 text-gray-400">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                <span class="text-[10px] mt-1 font-bold">筆記</span>
            </button>
            <button onclick="switchPage(4, '通知訊息')" class="nav-btn flex flex-col items-center flex-1 transition-colors duration-300 text-gray-400">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span class="text-[10px] mt-1 font-bold">通知</span>
            </button>
            <button onclick="switchPage(5, '個人帳戶')" class="nav-btn flex flex-col items-center flex-1 transition-colors duration-300 text-gray-400">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] mt-1 font-bold">我的</span>
            </button>
        </div>
    </nav>

    <div id="modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-md">
        <div id="modal-content" class="bg-white w-full max-w-xl rounded-[40px] p-10 transition-all duration-300 transform translate-y-10 opacity-0 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-6 right-8 text-gray-300 hover:text-gray-600 text-3xl transition-colors">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const characterData = {
            wang: { name: "王婆婆", detail: "王婆婆在廟街已有三十年經驗，是當地的活字典。她擅長透過米卦與氣場觀察為信眾指點迷津，特別是針對家中瑣事與尋找遺失物，準確度極高。", tags: ["專業米卦", "三十年經驗", "民俗專家"] },
            li: { name: "李阿姨", detail: "李阿姨風格親切現代，擅長將傳統智慧結合西方塔羅。她對於職場選擇、情感諮商有獨到的見解，是許多年輕上班族的首選心靈導師。", tags: ["心靈諮詢", "塔羅牌", "親切風格"] }
        };

        // 啟動進場動畫
        document.addEventListener("DOMContentLoaded", () => triggerCardAnimation());

        function triggerCardAnimation() {
            const cards = document.querySelectorAll('.card-enter');
            cards.forEach((card, i) => {
                card.classList.remove('show');
                setTimeout(() => card.classList.add('show'), i * 100);
            });
        }

        function switchPage(idx, title) {
            document.getElementById('app-header').innerText = title;
            document.querySelectorAll('.page').forEach((p, i) => {
                p.classList.toggle('hidden', i + 1 !== idx);
                p.classList.toggle('block', i + 1 === idx);
            });
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.toggle('text-blue-600', i + 1 === idx);
                btn.classList.toggle('text-gray-400', i + 1 !== idx);
            });
            if(idx === 1) triggerCardAnimation();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchSubPage(idx) {
            document.querySelectorAll('.sub-page').forEach((p, i) => p.classList.toggle('hidden', i + 1 !== idx));
            document.querySelectorAll('.sub-nav-btn').forEach((btn, i) => {
                btn.classList.toggle('text-blue-600', i + 1 === idx);
                btn.classList.toggle('border-blue-600', i + 1 === idx);
                btn.classList.toggle('text-gray-400', i + 1 !== idx);
            });
        }

        function showModal(key) {
            const data = characterData[key];
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            document.getElementById('modal-body').innerHTML = `
                <h2 class="text-3xl font-black text-gray-900">${data.name}</h2>
                <div class="flex flex-wrap gap-2 mt-4">
                    ${data.tags.map(t => `<span class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold tracking-wide">${t}</span>`).join('')}
                </div>
                <p class="mt-8 text-gray-500 text-lg leading-relaxed">${data.detail}</p>
                <div class="mt-10 flex gap-4">
                    <button class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">立即預約</button>
                    <button onclick="closeModal()" class="px-8 bg-gray-50 text-gray-400 py-4 rounded-2xl font-bold hover:bg-gray-100 transition-colors">關閉</button>
                </div>
            `;
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-y-10', 'opacity-0'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            content.classList.add('translate-y-10', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // 初始化
        switchSubPage(1);
    </script>
</body>
</html>
